# CI — verify the platform claim the README actually makes.
#
# README says "Works on Windows (PowerShell or Bash), macOS, Linux". Until this
# file existed that was an assertion, not a result: Wave 6's validation ran on
# Windows / Node 24 only. The matrix below is scoped to exactly that claim and no
# wider — if a row fails, the honest fix is to narrow the README, not to delete
# the row.
#
# Nothing here is Windows- or shell-specific: every suite spawns node through
# `process.execPath` and builds paths with `path.join`, and `npm test` chains with
# `&&`, which cmd.exe, PowerShell and sh all accept.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one platform failing must not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Unit and integration suites
        run: npm test

      - name: Smoke
        run: npm run smoke

      # The corpus and the regression lock both assert byte-identical output
      # across two runs in-process. This asserts it across two PROCESSES on a
      # cold machine, which is where a stray timestamp or a filesystem-ordering
      # dependency would actually show up.
      - name: Smoke is deterministic across processes
        shell: bash
        run: |
          npm run smoke > "$RUNNER_TEMP/smoke-1.txt"
          npm run smoke > "$RUNNER_TEMP/smoke-2.txt"
          diff "$RUNNER_TEMP/smoke-1.txt" "$RUNNER_TEMP/smoke-2.txt" \
            && echo "smoke output identical across runs"

      # An analysis command must not write to what it reads, and no suite may
      # leave an artefact behind. `out/` is gitignored scratch; anything else
      # appearing here is a tool that mutated the tree.
      # Nothing is written into the repo: `> dirty.txt` created the file BEFORE
      # git ran, so git dutifully reported `?? dirty.txt` and this step failed
      # itself on every platform. Its first-ever execution was a false positive
      # about its own artefact.
      - name: Working tree is unchanged
        shell: bash
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error::the test run modified tracked files:"
            echo "$dirty"
            exit 1
          fi
          echo "working tree clean"
